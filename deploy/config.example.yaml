# syncctl example configuration.
#
# All secret values MUST be supplied via environment variables using the
# dollar-brace-VAR placeholder syntax. Literal secrets in this file are
# rejected at load time, naming the offending field. Use
# --allow-literal-secrets while migrating an older config. Before running
# syncctl, export the referenced variables, e.g.:
#
#   export PG_CTRL_PASSWORD=...
#   export PG_REPL_PASSWORD=...
#   export SEC_REPL_PASSWORD=...
#   export S3_AK=...
#   export S3_SK=...

primary:
  name: primary-eu
  external_url: https://gitlab.primary.example.com
  postgres:
    host: 10.0.0.10
    port: 5432
    db: gitlabhq_production
    user: gitlab
    password: ${PG_CTRL_PASSWORD}
    replication_user: gitlab_repl
    replication_password: ${PG_REPL_PASSWORD}
    slot_name: gitlab_syncctl
    # TLS: defaults to 'require' (never cleartext). Set to 'disable' only
    # for local dev (a warning is logged). Other valid values:
    # allow, prefer, verify-ca, verify-full.
    sslmode: require
    # For verify-ca / verify-full, point to the CA cert:
    # ssl_root_cert: /etc/ssl/certs/pg-ca.pem
    # For mutual TLS:
    # ssl_cert: /etc/ssl/client-cert.pem
    # ssl_key: /etc/ssl/client-key.pem
  git:
    # "rsync": filesystem copy of repos_path (requires SSHHost).
    # "fetch": per-project git fetch via Gitaly/SSH (no FS access needed).
    mode: rsync
    repos_path: /var/opt/gitlab/git-data/repositories
    hashed_storage: true
  object_storage:
    backend: s3
    s3:
      # NOTE: this example pairs an EU primary with a US secondary to
      # show the format. Doing that for real moves personal data across a
      # border and needs a lawful transfer mechanism — see PRIVACY.md.
      region: eu-west-1
      primary_bucket: gitlab-primary
      replica_bucket: gitlab-replica
      access_key: ${S3_AK}
      secret_key: ${S3_SK}
      # Optional for MinIO:
      # endpoint: http://minio:9000
      replication_lag: 30s
  ssh_host: primary.example.com:22

secondaries:
  - name: secondary-us
    external_url: https://gitlab.secondary.example.com
    postgres:
      host: 10.1.0.10
      port: 5432
      db: gitlabhq_production
      user: gitlab
      password: ${PG_CTRL_PASSWORD}
      replication_user: gitlab_repl
      replication_password: ${SEC_REPL_PASSWORD}
      sslmode: require
    git:
      mode: rsync
      repos_path: /var/opt/gitlab/git-data/repositories
      hashed_storage: true
    object_storage:
      backend: s3
      s3:
        region: us-east-1
        primary_bucket: gitlab-primary
        replica_bucket: gitlab-replica
        access_key: ${S3_AK}
        secret_key: ${S3_SK}
    registry:
      mode: s3
      # The container registry is a separate service from GitLab, on its
      # own host and port. Without this URL the registry reconciler is
      # not run at all — it will not guess from external_url.
      url: https://registry.secondary.example.com
      s3:
        region: us-east-1
        primary_bucket: gitlab-registry-primary
        replica_bucket: gitlab-registry-replica
        access_key: ${S3_AK}
        secret_key: ${S3_SK}
    ssh_host: secondary.example.com:22

sync:
  sweep_interval: 5m
  lag_warning_threshold: 30s
  lag_critical_threshold: 5m
  failover_enabled: false
  read_only_secondary: false
  consistency_sample_pct: 0.01

metrics:
  # /metrics has no authentication and exposes site names, replication
  # lag, and drift counters. Loopback by default since 1.0; widen this
  # only if you scrape over a trusted network.
  addr: "127.0.0.1:9101"

log:
  level: info
  format: json
  # Replace project, group and repository paths in log lines with a
  # stable short hash. Turn this on if project names are confidential or
  # your logs leave your infrastructure — see PRIVACY.md.
  redact_project_paths: false

# Optional: webhook receiver for immediate per-project sync on push/create/delete.
# Export WEBHOOK_SECRET_TOKEN before starting syncctl.
# GitLab sends the secret token in a header on every delivery, so serve
# this over TLS — either with tls_cert/tls_key below, or behind a
# TLS-terminating proxy.
# webhook:
#   addr: ":9102"
#   secret_token: ${WEBHOOK_SECRET_TOKEN}
#   tls_cert: /etc/syncctl/webhook.crt
#   tls_key: /etc/syncctl/webhook.key

# Optional: API-driven observational validator (read-only, never writes).
# Export PRIMARY_API_TOKEN and SECONDARY_API_TOKEN before starting syncctl.
# api_validator:
#   enabled: true
#   primary_token: ${PRIMARY_API_TOKEN}
#   secondary_token: ${SECONDARY_API_TOKEN}

# Optional: SSH host-key verification policy.
# Production deployments should pin host keys via known_hosts_file and
# leave strict_host_key_checking at its default of "yes".
# ssh:
#   known_hosts_file: /etc/syncctl/known_hosts
#   # strict_host_key_checking: yes  # default: yes when known_hosts_file is set, otherwise accept-new

# Optional: failover controller.
# failover:
#   health_check_urls:
#     - https://gitlab.primary.example.com/-/health
#   health_check_interval: 10s
#   quorum_required: 1
#   dns_plugin: none  # route53 | cloudflare | none
#   dns_config:
#     zone_id: "Z123EXAMPLE"
#     record_name: "gitlab.primary.example.com"
#   auto_failover: false  # DANGEROUS: if true, fails over without human gate
#   # Which secondary auto-failover promotes. Optional with exactly one
#   # secondary; required with several — syncctl will not choose between
#   # replicas by config-file ordering.
#   promote_secondary: secondary-us