name: Release Please

# Maintains a rolling "chore(main): release X.Y.Z" pull request built from
# Conventional Commit messages on main. Merging that PR is what cuts a
# release: release-please tags the merge commit and creates the GitHub
# release as a draft, then this workflow calls the Release workflow to
# attach the built artifacts to it.
#
# The draft matters. GitHub freezes assets on a release once it is
# published (immutable releases), so a published release cannot be filled
# in afterwards — goreleaser gets a 422. release-please therefore leaves
# it in draft and goreleaser, which is also configured for draft, uploads
# into it. Publishing stays a deliberate manual step.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
