name: Release

on:
  push:
    tags:
      - "v*"
  # Invoked directly by release-please. A tag pushed with the default
  # GITHUB_TOKEN does not trigger workflows, so the release job cannot be
  # reached via the tag-push trigger above when release-please creates it.
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish, e.g. v0.2.0.
        required: true
        type: string

permissions:
  contents: write
  packages: write
  # id-token and attestations back SLSA build provenance for the released
  # archives — a signed statement, verifiable with `gh attestation verify`,
  # that a given file came out of this workflow at this commit.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          # Empty for tag pushes, where github.ref is already the tag.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25"
          cache: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver: docker-container
      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.48.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt