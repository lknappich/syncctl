name: Release

on:
  push:
    tags:
      - "v*"
  # Invoked directly by release-please. A tag pushed with the default
  # GITHUB_TOKEN does not trigger workflows, so the release job cannot be
  # reached via the tag-push trigger above when release-please creates it.
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish, e.g. v0.2.0.
        required: true
        type: string

permissions:
  contents: write
  packages: write
  # id-token and attestations back SLSA build provenance for the released
  # archives — a signed statement, verifiable with `gh attestation verify`,
  # that a given file came out of this workflow at this commit.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          # Empty for tag pushes, where github.ref is already the tag.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.48.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt

      # The image is attested by digest rather than tag: a tag can be
      # repointed later, a digest cannot, so the attestation stays bound
      # to the exact bytes goreleaser pushed.
      - name: Resolve the pushed image digest
        id: image
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Must match dockers_v2.images in .goreleaser.yaml.
          image="ghcr.io/lknappich/syncctl"
          digest=$(docker buildx imagetools inspect "${image}:${TAG#v}" \
            --format '{{.Manifest.Digest}}')
          echo "Resolved ${image}:${TAG#v} -> ${digest}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest container image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          # Stores the attestation alongside the image in GHCR, so
          # `gh attestation verify oci://...` works for anyone who can
          # pull it, without needing the GitHub API.
          push-to-registry: true