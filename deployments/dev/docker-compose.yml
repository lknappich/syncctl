services:
  postgres-primary:
    image: postgres:16.16-alpine3.24
    environment:
      POSTGRES_USER: gitlab
      POSTGRES_PASSWORD: ${PG_CTRL_PASSWORD:-gitlab}
      POSTGRES_DB: gitlabhq_production
    ports: ["5432:5432"]
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "hot_standby=on"]
    volumes:
      - pg-primary:/var/lib/postgresql/data
      - ./postgres-primary-init:/docker-entrypoint-initdb.d:ro

  postgres-secondary:
    image: postgres:16.16-alpine3.24
    environment:
      PGUSER: replicator
    depends_on: [postgres-primary]
    ports: ["5433:5432"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replicator -v -P -X stream -c fast -R; do
          echo "waiting for primary..."; sleep 2;
        done
        exec postgres -c hot_standby=on
    volumes:
      - pg-secondary:/var/lib/postgresql/data

  # MinIO no longer publishes community images. SeaweedFS's `weed mini`
  # (the image's default command) serves S3 on 8333 and creates the
  # buckets named in S3_BUCKET on first start.
  s3:
    image: chrislusf/seaweedfs:4.55
    environment:
      AWS_ACCESS_KEY_ID: ${S3_AK:-devaccesskey}
      AWS_SECRET_ACCESS_KEY: ${S3_SK:-devsecretkey}
      S3_BUCKET: gitlab-primary,gitlab-replica
    ports: ["8333:8333"]
    volumes: [s3-data:/data]

  syncctl:
    build: .
    depends_on: [postgres-primary, postgres-secondary, s3]
    environment:
      PG_CTRL_PASSWORD: ${PG_CTRL_PASSWORD:-gitlab}
      PG_REPL_PASSWORD: ${PG_REPL_PASSWORD:-replpass}
      SEC_REPL_PASSWORD: ${SEC_REPL_PASSWORD:-replpass}
      S3_AK: ${S3_AK:-devaccesskey}
      S3_SK: ${S3_SK:-devsecretkey}
    volumes:
      - ./config.yaml:/etc/syncctl/config.yaml:ro
    command: ["serve", "-c", "/etc/syncctl/config.yaml"]

volumes:
  pg-primary:
  pg-secondary:
  s3-data: